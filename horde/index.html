<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14151f">
<title>All Games</title>
<style>
  :root { --bg: #14151f; --card: #1f2130; --line: #33364a; --text: #eceef7; --dim: #9a9db8; --accent: #ffd54f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  header { max-width: 1100px; margin: 0 auto 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 28px; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  header p { margin: 0; color: var(--dim); font-size: 14px; flex-basis: 100%; }
  header a { margin-left: auto; color: var(--dim); font-size: 13px; text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
  main { max-width: 1100px; margin: 0 auto; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim); margin: 26px 0 10px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; }
  a.game { display: flex; gap: 12px; padding: 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); color: inherit; text-decoration: none;
    transition: transform .12s, border-color .12s; -webkit-tap-highlight-color: transparent; }
  a.game:hover, a.game:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  .ic { font-size: 40px; width: 56px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #2a2d40; }
  .info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .info b { font-size: 16px; }
  .info small { color: var(--dim); font-size: 12.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .best { color: var(--accent); font-size: 12px; font-weight: 600; }
  .num { color: var(--dim); font-size: 12px; font-weight: 600; margin-right: 4px; }
</style>
<script src="../cookies.js" defer></script>
</head>
<body>
<header>
  <h1>🕹️ All <span>Games</span></h1>
  <a href="../index.html">← Back to console</a>
  <p>Every game in one place: 20 horde-survival games, a play-money casino and the 9 console classics. Works on phone and desktop. Pick one and play.</p>
</header>
<main id="list"></main>
<script src="engine.js"></script>
<script src="games-chaos.js"></script>
<script src="games-retro.js"></script>
<script src="games-animal.js"></script>
<script src="games-math.js"></script>
<script>
(() => {
  const main = document.getElementById('list');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Games that live inside the main console page; each opens straight into its module via a #hash link.
  const CLASSICS = [
    ['surv', '☣️', 'Load Test Sim', 'Full survivor game: weapons, evolutions, playable characters, bosses and a loot wheel.'],
    ['snake', '🐍', 'Network Flow', 'Classic Snake. Steer the packet route, eat, grow, don\'t crash.'],
    ['tetris', '🧱', 'DB Defragmenter', 'Classic falling-block puzzle with hold and hard drop.'],
    ['flap', '➤', 'Packet Router', 'Flappy-style: tap to boost through firewall gaps and unlock builds.'],
    ['shaft', '⇅', 'Stack Descent', 'Fall down a shaft and tap to flip sideways gravity through the gaps.'],
    ['swing', '◎', 'Hook Swing', 'Swing from hooks: let go, fly, and grab the next one in reach.'],
    ['worm', '〰️', 'Log Trail', 'Flappy flight where every orb grows a tail that can clip the gaps.'],
    ['pulse', '◉', 'Shield Pulse', 'Hold to grow a shield and bounce incoming debris, without overheating.'],
    ['idle', '⚙️', 'Task Automation', 'Idle clicker: deploy, automate and keep earning while you\'re away.'],
  ];
  // Games already rebuilt as their own genre live in ../minis/ (the rest still use the horde engine).
  const REMADE = {
    grandma: ['Angry Grandma', 'Slingshot physics: fling Grandma\'s handbag and topple the pigeons\' towers.'],
    numbers: ['Number Smasher', 'Swipe and merge matching numbers. Can you reach 2048?'],
    cart: ['Shopping Cart Chaos', 'Endless supermarket runner: switch aisles, jump boxes, grab groceries.'],
    chicken: ['Chicken Apocalypse', 'Hop across roads, rivers and railways. Don\'t let the fox catch you!'],
    color: ['Color Match', 'Tap to bounce through spinning rings, but only through your own color.'],
    lawnmower: ['Lawnmower vs. Wild', 'Sliding puzzle: the mower rolls until it hits something. Mow every tile!'],
    garlic: ['Vampire Garlic', 'Tower defense: plant garlic, holy water, stakes and sun lamps to stop the vampire march.'],
    bricks: ['Brick Breaker', 'Classic breakout with multi-ball, lasers and other power-ups.'],
    pac: ['Pac-Horde', 'Maze chase: eat every dot, grab a power pellet and hunt the ghosts.'],
    pixel: ['Pixel Defender', 'Arcade invaders: blast the marching polygon armada from behind your shields.'],
  };
  let cat = null, grid = null, n = 0;
  for (const id of Horde.order) {
    const g = Horde.games[id];
    if (g.cat !== cat) {
      cat = g.cat;
      const h = document.createElement('h2'); h.textContent = cat; main.appendChild(h);
      grid = document.createElement('div'); grid.className = 'grid'; main.appendChild(grid);
    }
    n++;
    const a = document.createElement('a');
    a.className = 'game';
    if (REMADE[id]) {
      let best = null; try { best = JSON.parse(localStorage.getItem('mini-best-' + id)); } catch (e) { /* ignore */ }
      a.href = '../minis/' + id + '.html';
      a.innerHTML = '<span class="ic">' + g.icon + '</span><span class="info"><b><span class="num">' + n + '.</span>' + esc(REMADE[id][0]) + '</b><small>' + esc(REMADE[id][1]) + '</small>' +
        (best != null ? '<span class="best">Best: ' + best + '</span>' : '') + '</span>';
    } else {
      const best = Horde.store.get('best-' + id, 0);
      a.href = 'play.html?g=' + encodeURIComponent(id);
      a.innerHTML = '<span class="ic">' + g.icon + '</span><span class="info"><b><span class="num">' + n + '.</span>' + esc(g.name) + '</b><small>' + esc(g.hook) + '</small>' +
        (best ? '<span class="best">Best: ' + Horde.fmtTime(best) + '</span>' : '') + '</span>';
    }
    grid.appendChild(a);
  }
  // Play-money casino: every game shares one fake-chips wallet.
  const CASINO = [
    ['index.html', '🎰', 'Casino Lobby', 'All casino games and your free play-money Chips wallet.'],
    ['blackjack.html', '🃏', 'Blackjack', 'Beat the dealer to 21. Double and split.'],
    ['holdem.html', '♠️', "Texas Hold'em", 'No-limit poker vs 3 computer players.'],
    ['videopoker.html', '🎴', 'Video Poker', 'Jacks or Better: hold, draw, hit a Royal.'],
    ['baccarat.html', '💎', 'Baccarat', 'Player, Banker or Tie: closest to 9 wins.'],
    ['roulette.html', '🎡', 'Roulette', 'European wheel: numbers, colours, dozens.'],
    ['slots.html', '🎰', 'Lucky Slots', '3 reels, 5 lines, big 7️⃣ jackpot.'],
    ['crash.html', '🚀', 'Crash Rocket', 'Cash out before the rocket blows up.'],
    ['mines.html', '💣', 'Mines', 'Find gems on a 5×5 grid, dodge the mines.'],
    ['plinko.html', '🔻', 'Plinko', 'Drop balls through pegs into multipliers.'],
    ['hilo.html', '⬆️', 'Hi-Lo', 'Higher or lower? Build a streak, cash out.'],
    ['wheel.html', '🎯', 'Money Wheel', 'Big Six wheel: bet on 1, 2, 5, 10, 20 or ★.'],
    ['dice.html', '🎲', 'Dice', 'Roll over or under your target.'],
  ];
  const ch = document.createElement('h2'); ch.textContent = 'Casino · play money'; main.appendChild(ch);
  grid = document.createElement('div'); grid.className = 'grid'; main.appendChild(grid);
  for (const [file, icon, name, desc] of CASINO) {
    const a = document.createElement('a');
    a.className = 'game'; a.href = '../casino/' + file;
    a.innerHTML = '<span class="ic">' + icon + '</span><span class="info"><b>' + esc(name) + '</b><small>' + esc(desc) + '</small></span>';
    grid.appendChild(a);
  }
  const h = document.createElement('h2'); h.textContent = 'Console Classics'; main.appendChild(h);
  grid = document.createElement('div'); grid.className = 'grid'; main.appendChild(grid);
  for (const [view, icon, name, desc] of CLASSICS) {
    n++;
    const a = document.createElement('a');
    a.className = 'game'; a.href = '../index.html#' + view;
    a.innerHTML = '<span class="ic">' + icon + '</span><span class="info"><b><span class="num">' + n + '.</span>' + esc(name) + '</b><small>' + esc(desc) + '</small></span>';
    grid.appendChild(a);
  }
})();
</script>
</body>
</html>
