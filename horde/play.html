<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>Horde Arcade</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #cv { display: block; touch-action: none; position: fixed; inset: 0; }
  #safe { position: fixed; visibility: hidden; pointer-events: none; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  button { font: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; }
  #pauseBtn { position: fixed; top: calc(env(safe-area-inset-top) + 20px); right: 10px; width: 40px; height: 34px; border-radius: 10px; border: none;
    background: rgba(0,0,0,0.45); color: #fff; font-size: 16px; display: none; z-index: 5; }
  .ov { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); background: rgba(5,5,12,0.72); }
  .ov.show { display: flex; }
  .panel { width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; background: #1d1e2a; border: 2px solid #383a52; border-radius: 18px; padding: 20px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .big { font-size: 64px; line-height: 1; }
  h1 { margin: 8px 0 6px; font-size: 26px; }
  h2 { margin: 0 0 12px; font-size: 28px; color: #ffd54f; letter-spacing: 1px; }
  p { margin: 6px 0; color: #c8cad8; font-size: 14px; line-height: 1.45; }
  .how { background: #262838; border-radius: 10px; padding: 8px 10px; font-size: 13px; color: #e6e7f0; margin: 12px 0; }
  .ups { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 10px 0; }
  .ups span { background: #2b2d40; border-radius: 999px; padding: 4px 10px; font-size: 12px; color: #d8d9e6; }
  .btn { display: block; width: 100%; margin-top: 10px; padding: 14px; border-radius: 12px; border: none; font-size: 17px; font-weight: 700; color: #111; background: #ffd54f; text-decoration: none; text-align: center; }
  .btn.alt { background: #34364c; color: #fff; }
  .row { display: flex; gap: 8px; } .row .btn { flex: 1; }
  #sBest, #overBest { color: #ffd54f; font-weight: 600; margin-top: 8px; min-height: 1em; }
  #cards { display: flex; flex-direction: column; gap: 10px; }
  .card { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px; border-radius: 14px; border: 2px solid #4a4d6a; background: #262838; color: #fff; position: relative; transition: transform .1s, border-color .1s; }
  .card:hover, .card:active { transform: scale(1.02); border-color: #ffd54f; }
  .card .ci { font-size: 34px; width: 48px; text-align: center; flex: none; }
  .card .cb { display: flex; flex-direction: column; gap: 2px; }
  .card b { font-size: 16px; } .card small { color: #ffd54f; font-size: 11px; font-weight: 700; letter-spacing: .5px; } .card .cb > span { color: #c8cad8; font-size: 13px; }
  .card kbd { position: absolute; top: 6px; right: 8px; font-size: 10px; color: #777a99; font-family: inherit; }
  #overStats { display: flex; justify-content: space-around; margin: 14px 0 4px; }
  #overStats div { display: flex; flex-direction: column; } #overStats b { font-size: 24px; } #overStats small { color: #9a9cb5; font-size: 12px; }
  #pauseUps { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; font-size: 24px; margin: 10px 0; }
  #pauseUps sub { font-size: 11px; color: #ffd54f; } #pauseUps i { font-size: 13px; color: #9a9cb5; }
</style>
<script src="../cookies.js" defer></script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="safe"></div>
<button id="pauseBtn" aria-label="Pause">❚❚</button>

<div class="ov" id="start"><div class="panel">
  <div class="big" id="sEmoji"></div>
  <h1 id="sTitle"></h1>
  <p id="sHook"></p>
  <div class="how" id="sHow"></div>
  <div class="ups" id="sUps"></div>
  <div id="sBest"></div>
  <button class="btn" id="playBtn">▶ Play</button>
  <a class="btn alt" href="index.html">← All games</a>
</div></div>

<div class="ov" id="lvl"><div class="panel">
  <h2 id="lvlTitle">LEVEL UP!</h2>
  <div id="cards"></div>
</div></div>

<div class="ov" id="pause"><div class="panel">
  <h2>PAUSED</h2>
  <div id="pauseUps"></div>
  <button class="btn" id="resumeBtn">▶ Resume</button>
  <div class="row"><button class="btn alt" id="restartBtn">↻ Restart</button><button class="btn alt" id="muteBtn">🔊</button></div>
  <a class="btn alt" href="index.html">← All games</a>
</div></div>

<div class="ov" id="over"><div class="panel">
  <h2 id="overTitle">OVERRUN!</h2>
  <div id="overStats"></div>
  <div id="overBest"></div>
  <button class="btn" id="retryBtn">↻ Play again</button>
  <a class="btn alt" href="index.html">← All games</a>
</div></div>

<script src="engine.js"></script>
<script src="games-chaos.js"></script>
<script src="games-retro.js"></script>
<script src="games-animal.js"></script>
<script src="games-math.js"></script>
<script>Horde.boot();</script>
</body>
</html>
