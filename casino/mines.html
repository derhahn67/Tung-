<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mines · Play-Money Casino</title>
<link rel="stylesheet" href="casino.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 380px; margin: 0 auto; }
  .tile { width: 100%; aspect-ratio: 1; border: none; border-radius: 12px; background: #2f4a3d; font-size: 30px; box-shadow: inset 0 -4px rgba(0,0,0,.3); transition: transform .1s; }
  .tile:not(:disabled):hover { transform: translateY(-2px); background: #3b5c4c; }
  .tile.gem { background: #1b5e20; animation: pop .25s; } .tile.bomb { background: #b71c1c; animation: pop .25s; }
  .tile.ghost { opacity: .45; }
  @keyframes pop { 50% { transform: scale(1.15); } }
  .mrow { display: flex; gap: 8px; align-items: center; justify-content: center; }
  .mrow select { padding: 8px; border-radius: 9px; font: inherit; font-weight: 800; }
  .mult { text-align: center; font-size: 22px; font-weight: 900; color: var(--gold); }
</style>
<script src="../cookies.js" defer></script>
</head>
<body>
<script src="casino.js"></script>
<script>Casino.header('Mines', '💣');</script>
<div class="wrap">
  <div class="panel col">
    <div class="mult" id="mult">Find the gems, avoid the mines</div>
    <div class="grid" id="grid"></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="panel col" style="margin-top:12px">
    <div id="bet"></div>
    <div class="mrow"><span class="label">Mines</span><select id="mines"></select></div>
    <div class="row"><button class="btn gold" id="go" style="min-width:200px">Start</button></div>
  </div>
  <p class="disclaimer">More mines means a bigger multiplier per gem (97% return). Play money only.</p>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const bet = Casino.betBox($('bet'), { key: 'mines', init: 50 });
  const sel = $('mines');
  for (let i = 1; i <= 24; i++) sel.insertAdjacentHTML('beforeend', '<option' + (i === 3 ? ' selected' : '') + '>' + i + '</option>');
  let mines = new Set(), open = new Set(), live = false, stake = 0, nM = 3;
  const multFor = (k, m) => { let x = 0.97; for (let i = 0; i < k; i++) x *= (25 - i) / (25 - m - i); return x; };
  const G = $('grid'), tiles = [];
  for (let i = 0; i < 25; i++) { const b = document.createElement('button'); b.className = 'tile'; b.disabled = true; b.onclick = () => pickTile(i); G.appendChild(b); tiles.push(b); }
  function msg(t, cls) { const m = $('msg'); m.textContent = t; m.className = 'msg' + (cls ? ' ' + cls : ''); }
  function head() {
    if (!live) return;
    const cur = multFor(open.size, nM), nxt = multFor(open.size + 1, nM);
    $('mult').textContent = '×' + cur.toFixed(2) + ' · next ×' + nxt.toFixed(2);
    $('go').textContent = open.size ? 'Cash out 🪙 ' + Casino.fmt(stake * cur) : 'Pick a tile';
    $('go').disabled = !open.size;
  }
  function reveal(lost) {
    tiles.forEach((t, i) => { t.disabled = true; if (!open.has(i)) { t.textContent = mines.has(i) ? '💣' : '💎'; t.classList.add('ghost'); } });
    live = false; bet.disable(false); sel.disabled = false; $('go').disabled = false; $('go').textContent = 'Start';
  }
  function pickTile(i) {
    if (!live || open.has(i)) return;
    open.add(i);
    if (mines.has(i)) { tiles[i].textContent = '💣'; tiles[i].classList.add('bomb'); Casino.sfx('lose'); msg('Boom! Lost 🪙 ' + Casino.fmt(stake), 'lose'); $('mult').textContent = 'Better luck next time'; reveal(true); return; }
    tiles[i].textContent = '💎'; tiles[i].classList.add('gem'); tiles[i].disabled = true; Casino.sfx('chip');
    if (open.size === 25 - nM) return cash();
    head();
  }
  function cash() {
    const win = Math.floor(stake * multFor(open.size, nM));
    Casino.pay(win, stake); Casino.sfx('win'); msg('Cashed out 🪙 ' + Casino.fmt(win), 'win');
    $('mult').textContent = '×' + multFor(open.size, nM).toFixed(2); reveal(false);
  }
  $('go').onclick = () => {
    if (live) { if (open.size) cash(); return; }
    if (!Casino.bet(bet.value)) return;
    stake = bet.value; nM = +sel.value; mines = new Set(); open = new Set();
    while (mines.size < nM) mines.add(Casino.rand(25));
    tiles.forEach((t) => { t.textContent = ''; t.className = 'tile'; t.disabled = false; });
    live = true; bet.disable(true); sel.disabled = true; msg(''); head();
  };
})();
</script>
</body>
</html>
