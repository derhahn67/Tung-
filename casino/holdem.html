<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Texas Hold'em · Play-Money Casino</title>
<link rel="stylesheet" href="casino.css">
<style>
  :root { --cw: 50px; }
  .seats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seat { background: rgba(0,0,0,.25); border: 2px solid transparent; border-radius: 12px; padding: 8px 6px; text-align: center; position: relative; min-width: 0; }
  .seat.turn { border-color: var(--gold); box-shadow: 0 0 14px rgba(255,213,79,.35); }
  .seat.out { opacity: .45; }
  .seat.winner { border-color: #69f0ae; box-shadow: 0 0 16px rgba(105,240,174,.5); }
  .seat .nm { font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seat .stk { color: var(--gold); font-weight: 800; font-size: 13px; }
  .seat .act { font-size: 12px; color: var(--dim); min-height: 16px; }
  .seat .cards { min-height: calc(var(--cw) * 1.45); gap: 3px; }
  .dbtn { position: absolute; top: -8px; right: -6px; background: #fff; color: #000; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; font-weight: 900; line-height: 22px; }
  .betchip { font-size: 12px; font-weight: 800; color: #fff; background: #1565c0; border-radius: 999px; padding: 1px 8px; display: inline-block; min-height: 18px; }
  .board { margin: 14px 0 6px; }
  .pot { text-align: center; font-weight: 900; color: var(--gold); font-size: 18px; }
  #me .cards { --cw: 64px; }
  #lobby { text-align: center; }
</style>
<script src="../cookies.js" defer></script>
</head>
<body>
<script src="casino.js"></script>
<script>Casino.header("Texas Hold'em", '♠️');</script>
<div class="wrap">
  <div class="panel">
    <div class="seats" id="bots"></div>
    <div class="cards board" id="board"></div>
    <div class="pot" id="pot"></div>
    <div class="msg" id="msg"></div>
    <div class="seat" id="me" style="max-width:340px;margin:0 auto"></div>
  </div>
  <div class="panel col" style="margin-top:12px">
    <div id="lobby" class="col">
      <p class="muted" style="margin:0">Blinds 10 / 20 · No-limit · You vs 3 computer players. Buy in with chips from your wallet; leaving the table puts your stack back.</p>
      <div class="row" id="buyins"></div>
    </div>
    <div class="row" id="acts" style="display:none">
      <button class="btn red" id="fold">Fold</button>
      <button class="btn blue" id="call">Check</button>
      <button class="btn gold" id="raise">Raise</button>
      <button class="btn" id="pot2">Pot</button>
      <button class="btn" id="allin">All-in</button>
    </div>
    <div class="row" id="between" style="display:none">
      <button class="btn gold" id="nextHand">Next hand</button>
      <button class="btn" id="leave">Leave table</button>
    </div>
  </div>
  <p class="disclaimer">Computer players estimate their odds by simulation and sometimes bluff. Play money only.</p>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const SB = 10, BB = 20, SEATKEY = 'casino-holdem-seat';
  const BOTS = [['🤠', 'Tex'], ['🦊', 'Foxy'], ['🤖', 'Chipbot']];
  // Return chips left at the table last time (e.g. the page was closed mid-session).
  try {
    const left = parseInt(localStorage.getItem(SEATKEY), 10);
    if (left > 0) { Casino.pay(left); localStorage.removeItem(SEATKEY); setTimeout(() => Casino.toast('Returned ' + Casino.fmt(left) + ' chips from your last table'), 700); }
  } catch (e) { /* ignore */ }
  const P = [{ icon: '🙂', name: 'You', stack: 0, bot: false }].concat(BOTS.map(([icon, name]) => ({ icon, name, stack: 1000, bot: true })));
  let dealer = 0, deck = [], board = [], curBet = 0, minRaise = BB, turn = -1, inHand = false, showdown = false, waiter = null, winners = [];
  const saveSeat = () => { try { localStorage.setItem(SEATKEY, String(P[0].stack)); } catch (e) { /* ignore */ } };
  const live = () => P.filter((p) => p.inHand && !p.folded);
  const pot = () => P.reduce((a, p) => a + p.total, 0);
  const nextIdx = (i) => (i + 1) % P.length;
  function msg(t, cls) { const m = $('msg'); m.textContent = t; m.className = 'msg' + (cls ? ' ' + cls : ''); }

  function seatHTML(p, i) {
    const showCards = !p.bot || (showdown && !p.folded);
    const el = document.createElement('div');
    el.className = 'seat' + (i === turn ? ' turn' : '') + ((p.folded || !p.inHand) && inHand ? ' out' : '') + (winners.includes(p) ? ' winner' : '');
    el.innerHTML = (i === dealer ? '<span class="dbtn">D</span>' : '') + '<div class="nm">' + p.icon + ' ' + p.name + '</div><div class="stk">🪙 ' + Casino.fmt(p.stack) + '</div>' +
      '<div class="act">' + (p.note || '') + '</div><div><span class="betchip" style="visibility:' + (p.bet ? 'visible' : 'hidden') + '">' + Casino.fmt(p.bet || 0) + '</span></div>';
    const cs = document.createElement('div'); cs.className = 'cards';
    (p.hole || []).forEach((c) => { const e = Casino.cardEl(c, !showCards); if (p.folded) e.classList.add('dim'); cs.appendChild(e); });
    el.appendChild(cs);
    return el;
  }
  function render() {
    const b = $('bots'); b.innerHTML = '';
    for (let i = 1; i < P.length; i++) b.appendChild(seatHTML(P[i], i));
    const me = seatHTML(P[0], 0); me.id = 'me'; me.style.cssText = 'max-width:340px;margin:0 auto';
    $('me').replaceWith(me);
    const bd = $('board'); bd.innerHTML = ''; board.forEach((c) => bd.appendChild(Casino.cardEl(c)));
    $('pot').textContent = inHand || pot() ? 'Pot: 🪙 ' + Casino.fmt(pot()) : '';
    if (inHand && !showdown && P[0].hole && !P[0].folded && board.length) {
      $('me').querySelector('.act').textContent = Casino.evalHand(P[0].hole.concat(board)).name;
    }
  }
  function lobby() {
    const L = $('buyins'); L.innerHTML = '';
    for (const amt of [500, 1000, 2500, 5000]) {
      const b = document.createElement('button');
      b.className = 'btn gold'; b.textContent = 'Sit with 🪙 ' + Casino.fmt(amt);
      b.disabled = Casino.balance < amt;
      b.onclick = () => { if (!Casino.bet(amt)) return; P[0].stack = amt; saveSeat(); $('lobby').style.display = 'none'; startHand(); };
      L.appendChild(b);
    }
    if (Casino.balance < 500) L.insertAdjacentHTML('beforeend', '<p class="muted">You need at least 500 chips. Tap your balance for free chips.</p>');
    $('lobby').style.display = 'flex'; $('acts').style.display = 'none'; $('between').style.display = 'none';
  }

  function put(p, amt) { amt = Math.min(amt, p.stack); p.stack -= amt; p.bet += amt; p.total += amt; if (p.stack === 0) p.allIn = true; return amt; }
  async function startHand() {
    $('between').style.display = 'none';
    for (const p of P) if (p.bot && p.stack < BB) { p.stack = 1000; p.note = 'rebought'; }
    if (P[0].stack <= 0) { msg('You are out of chips at this table'); saveSeat(); lobby(); return; }
    deck = Casino.newDeck(); board = []; showdown = false; winners = [];
    for (const p of P) Object.assign(p, { hole: [deck.pop(), deck.pop()], bet: 0, total: 0, folded: false, allIn: false, acted: false, inHand: p.stack > 0, note: '' });
    dealer = nextIdx(dealer);
    const sb = nextIdx(dealer), bb = nextIdx(sb);
    put(P[sb], SB); P[sb].note = 'small blind'; put(P[bb], BB); P[bb].note = 'big blind';
    curBet = BB; minRaise = BB; inHand = true; msg('');
    Casino.sfx('card');
    for (let street = 0; street < 4; street++) {
      if (street > 0) {
        for (const p of P) { p.bet = 0; p.acted = false; if (!p.folded && p.inHand) p.note = p.allIn ? 'all-in' : ''; }
        curBet = 0; minRaise = BB;
        board.push(...deck.splice(0, street === 1 ? 3 : 1));
        Casino.sfx('card');
      }
      render();
      await Casino.sleep(street ? 500 : 200);
      if (live().filter((p) => !p.allIn).length > 1 || (street === 0)) await bettingRound(street === 0 ? nextIdx(bb) : nextIdx(dealer));
      if (live().length === 1) break;
    }
    finish();
  }
  async function bettingRound(start) {
    turn = start;
    for (let guard = 0; guard < 200; guard++) {
      const L = live();
      if (L.length <= 1) break;
      const open = L.filter((p) => !p.allIn);
      if (open.every((p) => p.acted && p.bet === curBet) || (open.length === 0) || (open.length === 1 && open[0].bet >= curBet && open[0].acted)) break;
      if (open.length === 1 && open[0].bet >= curBet && L.length > 1 && L.every((p) => p.allIn || p === open[0])) break;
      const p = P[turn];
      if (p.inHand && !p.folded && !p.allIn) {
        render();
        const a = p.bot ? await botAct(p) : await humanAct(p);
        apply(p, a);
        render();
      }
      turn = nextIdx(turn);
    }
    turn = -1;
  }
  function apply(p, a) {
    const toCall = curBet - p.bet;
    if (a.type === 'fold') { p.folded = true; p.note = 'fold'; }
    else if (a.type === 'call') {
      if (toCall <= 0) p.note = 'check';
      else { put(p, toCall); p.note = p.allIn ? 'all-in' : 'call ' + Casino.fmt(toCall); }
      Casino.sfx('chip');
    } else if (a.type === 'raise') {
      let to = Math.min(a.to, p.stack + p.bet);
      if (to <= curBet) { return apply(p, { type: 'call' }); }
      const inc = to - curBet;
      put(p, to - p.bet);
      if (inc >= minRaise) { minRaise = inc; for (const q of P) if (q !== p && !q.folded && !q.allIn) q.acted = false; }
      curBet = Math.max(curBet, p.bet);
      p.note = p.allIn ? 'ALL-IN ' + Casino.fmt(p.bet) : 'raise to ' + Casino.fmt(p.bet);
      Casino.sfx('chip');
    }
    p.acted = true;
  }
  function humanAct(p) {
    const toCall = curBet - p.bet;
    $('acts').style.display = 'flex';
    $('call').textContent = toCall > 0 ? 'Call ' + Casino.fmt(Math.min(toCall, p.stack)) : 'Check';
    const rTo = curBet + minRaise, potTo = curBet + (pot() + toCall);
    $('raise').textContent = (curBet ? 'Raise to ' : 'Bet ') + Casino.fmt(Math.min(rTo, p.stack + p.bet));
    $('pot2').textContent = 'Pot ' + Casino.fmt(Math.min(potTo, p.stack + p.bet));
    $('raise').disabled = p.stack <= toCall; $('pot2').disabled = p.stack <= toCall || potTo <= rTo;
    $('fold').disabled = toCall <= 0;
    msg('Your turn');
    return new Promise((res) => {
      const done = (a) => { $('acts').style.display = 'none'; msg(''); res(a); };
      $('fold').onclick = () => done({ type: 'fold' });
      $('call').onclick = () => done({ type: 'call' });
      $('raise').onclick = () => done({ type: 'raise', to: rTo });
      $('pot2').onclick = () => done({ type: 'raise', to: potTo });
      $('allin').onclick = () => done({ type: 'raise', to: p.stack + p.bet });
    });
  }
  function equity(p, sims = 180) {
    const opps = live().length - 1;
    const known = p.hole.concat(board), used = new Set(known.map((c) => c.r * 4 + c.s));
    const rest = []; for (let s = 0; s < 4; s++) for (let r = 2; r <= 14; r++) if (!used.has(r * 4 + s)) rest.push({ r, s });
    let score = 0;
    for (let k = 0; k < sims; k++) {
      for (let i = rest.length - 1; i > rest.length - 1 - (opps * 2 + 5 - board.length) && i > 0; i--) { const j = Casino.rand(i + 1); [rest[i], rest[j]] = [rest[j], rest[i]]; }
      let idx = rest.length - 1;
      const full = board.slice(); while (full.length < 5) full.push(rest[idx--]);
      const mine = Casino.evalHand(p.hole.concat(full)).score;
      let best = 0, ties = 0;
      for (let o = 0; o < opps; o++) {
        const s = Casino.evalHand([rest[idx--], rest[idx--]].concat(full)).score;
        if (s > best) { best = s; }
        if (s === mine) ties++;
      }
      if (mine > best) score += 1; else if (mine === best) score += 1 / (ties + 1);
    }
    return score / sims;
  }
  async function botAct(p) {
    await Casino.sleep(550 + Casino.rand(450));
    const eq = equity(p), toCall = curBet - p.bet, P0 = pot(), r = Math.random();
    const odds = toCall / (P0 + toCall || 1);
    const strong = eq > 0.72 || (eq > 0.55 && r < 0.35);
    if (strong && p.stack > toCall) {
      const size = curBet + Math.max(minRaise, Math.round(P0 * (0.5 + Math.random() * 0.5) / 10) * 10);
      return { type: 'raise', to: eq > 0.88 && r < 0.3 ? p.stack + p.bet : size };
    }
    if (toCall === 0) return r < 0.1 ? { type: 'raise', to: curBet + Math.max(minRaise, Math.round(P0 * 0.5 / 10) * 10) } : { type: 'call' };
    if (eq >= odds + 0.04 || (toCall <= BB && eq > 0.25)) return { type: 'call' };
    if (r < 0.05) return { type: 'call' };
    return { type: 'fold' };
  }
  function finish() {
    turn = -1;
    const L = live();
    let summary;
    if (L.length === 1) {
      const w = L[0], amt = pot(); w.stack += amt; winners = [w];
      summary = (w.bot ? w.name + ' wins ' : 'You win ') + Casino.fmt(amt);
    } else {
      showdown = true;
      while (board.length < 5) board.push(deck.pop());
      const score = new Map(L.map((p) => [p, Casino.evalHand(p.hole.concat(board))]));
      const levels = [...new Set(P.map((p) => p.total).filter((t) => t > 0))].sort((a, b) => a - b);
      let prev = 0; const won = new Map();
      for (const lv of levels) {
        let chunk = 0; for (const p of P) chunk += Math.max(0, Math.min(p.total, lv) - prev);
        let elig = L.filter((p) => p.total >= lv);
        if (!elig.length) elig = [L.reduce((a, b) => (b.total > a.total ? b : a))];
        const top = Math.max(...elig.map((p) => score.get(p).score));
        const ws = elig.filter((p) => score.get(p).score === top);
        const share = Math.floor(chunk / ws.length);
        ws.forEach((w, i) => won.set(w, (won.get(w) || 0) + share + (i === 0 ? chunk - share * ws.length : 0)));
        prev = lv;
      }
      for (const p of L) p.note = score.get(p).name;
      // a 'winner' made a profit (getting back an uncalled side pot doesn't count)
      winners = [...won.keys()].filter((p) => won.get(p) > p.total);
      for (const [p, amt] of won) p.stack += amt;
      const top = [...won.entries()].sort((a, b) => b[1] - a[1])[0];
      summary = (top[0].bot ? top[0].name + ' wins ' : 'You win ') + Casino.fmt(top[1]) + ' with ' + score.get(top[0]).name;
    }
    for (const p of P) { p.total = 0; p.bet = 0; }
    inHand = false; saveSeat(); render();
    msg(summary, winners.includes(P[0]) ? 'win' : 'lose');
    Casino.sfx(winners.includes(P[0]) ? 'win' : 'lose');
    $('between').style.display = 'flex';
    $('nextHand').disabled = P[0].stack <= 0;
    if (P[0].stack <= 0) msg('You are out of chips at this table', 'lose');
  }
  $('nextHand').onclick = () => startHand();
  $('leave').onclick = () => {
    const s = P[0].stack; P[0].stack = 0;
    try { localStorage.removeItem(SEATKEY); } catch (e) { /* ignore */ }
    if (s > 0) { Casino.pay(s); Casino.toast('Cashed ' + Casino.fmt(s) + ' chips back to your wallet'); }
    P.forEach((p) => { p.hole = []; p.note = ''; }); board = []; render(); msg(''); lobby();
  };
  render(); lobby();
})();
</script>
</body>
</html>
