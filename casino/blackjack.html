<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Blackjack · Play-Money Casino</title>
<link rel="stylesheet" href="casino.css">
<style>
  .area { margin: 10px 0; }
  .hands { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .hand { padding: 8px; border-radius: 12px; border: 2px solid transparent; }
  .hand.active { border-color: var(--gold); background: rgba(255,213,79,.08); }
  .tot { text-align: center; font-weight: 800; margin-top: 6px; }
</style>
<script src="../cookies.js" defer></script>
</head>
<body>
<script src="casino.js"></script>
<script>Casino.header('Blackjack', '🃏');</script>
<div class="wrap">
  <div class="panel">
    <div class="area"><div class="label center">Dealer</div><div class="cards" id="dealer"></div><div class="tot" id="dtot"></div></div>
    <div class="msg" id="msg">Place your bet</div>
    <div class="area"><div class="hands" id="hands"></div></div>
  </div>
  <div class="panel col" style="margin-top:12px">
    <div class="row" id="acts" style="display:none">
      <button class="btn gold" id="hit">Hit</button><button class="btn blue" id="stand">Stand</button>
      <button class="btn" id="double">Double</button><button class="btn" id="split">Split</button>
    </div>
    <div id="betRow" class="col"><div id="bet"></div><div class="row"><button class="btn gold" id="deal">Deal</button></div></div>
  </div>
  <p class="disclaimer">Blackjack pays 3:2 · Dealer stands on all 17s · Double on any two cards · Split up to 4 hands · 6-deck shoe.<br>Play money only.</p>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const bet = Casino.betBox($('bet'), { key: 'bj', init: 50 });
  let shoe = Casino.newDeck(6), dealer = [], hands = [], cur = 0, busy = false;
  const val = (c) => (c.r === 14 ? 11 : Math.min(10, c.r));
  function total(cards) {
    let t = 0, aces = 0;
    for (const c of cards) { t += val(c); if (c.r === 14) aces++; }
    while (t > 21 && aces) { t -= 10; aces--; }
    return { t, soft: aces > 0 };
  }
  const isBJ = (cards) => cards.length === 2 && total(cards).t === 21;
  function draw() { if (shoe.length < 60) { shoe = Casino.newDeck(6); Casino.toast('Shuffling a fresh shoe'); } Casino.sfx('card'); return shoe.pop(); }
  function render(hideHole) {
    const d = $('dealer'); d.innerHTML = '';
    dealer.forEach((c, i) => d.appendChild(Casino.cardEl(c, hideHole && i === 1)));
    $('dtot').textContent = dealer.length ? (hideHole ? total([dealer[0]]).t : total(dealer).t) : '';
    const H = $('hands'); H.innerHTML = '';
    hands.forEach((h, i) => {
      const box = document.createElement('div');
      box.className = 'hand' + (hideHole && i === cur && hands.length > 1 ? ' active' : '');
      const cs = document.createElement('div'); cs.className = 'cards';
      h.cards.forEach((c) => cs.appendChild(Casino.cardEl(c)));
      const tt = total(h.cards);
      const tot = document.createElement('div'); tot.className = 'tot';
      tot.textContent = (tt.t > 21 ? 'BUST ' : (tt.soft && tt.t < 21 && h.cards.length ? 'soft ' : '')) + tt.t + ' · 🪙 ' + Casino.fmt(h.bet) + (h.result ? ' · ' + h.result : '');
      box.append(cs, tot); H.appendChild(box);
    });
  }
  function setActs() {
    const h = hands[cur];
    $('acts').style.display = h ? 'flex' : 'none';
    if (!h) return;
    const two = h.cards.length === 2;
    $('double').disabled = !two || Casino.balance < h.bet;
    $('split').disabled = !two || hands.length >= 4 || val(h.cards[0]) !== val(h.cards[1]) || Casino.balance < h.bet;
  }
  function msg(t, cls) { const m = $('msg'); m.textContent = t; m.className = 'msg' + (cls ? ' ' + cls : ''); }

  $('deal').onclick = async () => {
    if (busy || !Casino.bet(bet.value)) return;
    busy = true;
    $('betRow').style.display = 'none';
    dealer = []; hands = [{ cards: [], bet: bet.value }]; cur = 0; msg('');
    for (let i = 0; i < 2; i++) { hands[0].cards.push(draw()); render(true); await Casino.sleep(220); dealer.push(draw()); render(true); await Casino.sleep(220); }
    const up = val(dealer[0]);
    if ((up >= 10) && isBJ(dealer)) { render(false); return settle(); }
    if (isBJ(hands[0].cards)) { render(false); return settle(); }
    busy = false; render(true); setActs();
  };
  async function next() {
    while (cur < hands.length && (hands[cur].done || total(hands[cur].cards).t >= 21)) cur++;
    if (cur < hands.length) { render(true); setActs(); return; }
    $('acts').style.display = 'none'; busy = true;
    render(false);
    const live = hands.some((h) => total(h.cards).t <= 21);
    while (live && total(dealer).t < 17) { await Casino.sleep(450); dealer.push(draw()); render(false); }
    settle();
  }
  function settle() {
    const d = total(dealer).t, dBJ = isBJ(dealer);
    let back = 0, staked = 0;
    for (const h of hands) {
      const p = total(h.cards).t, pBJ = isBJ(h.cards) && hands.length === 1;
      staked += h.bet;
      if (pBJ && !dBJ) { h.result = 'BLACKJACK'; back += h.bet * 2.5; }
      else if (p > 21) h.result = 'lose';
      else if (dBJ && !pBJ) h.result = 'lose';
      else if (d > 21 || p > d) { h.result = 'win'; back += h.bet * 2; }
      else if (p === d) { h.result = 'push'; back += h.bet; }
      else h.result = 'lose';
    }
    render(false);
    Casino.pay(back, staked);
    const net = back - staked;
    if (net > 0) { msg((hands.some((h) => h.result === 'BLACKJACK') ? 'Blackjack! ' : 'You win ') + '+' + Casino.fmt(net), 'win'); Casino.sfx('win'); }
    else if (net === 0) msg('Push, bet returned');
    else { msg(d > 21 ? 'Lost ' + Casino.fmt(-net) : (dBJ ? 'Dealer blackjack' : 'Dealer wins'), 'lose'); Casino.sfx('lose'); }
    $('acts').style.display = 'none'; $('betRow').style.display = 'flex'; busy = false;
  }
  $('hit').onclick = () => { if (busy) return; const h = hands[cur]; h.cards.push(draw()); render(true); if (total(h.cards).t >= 21) next(); else setActs(); };
  $('stand').onclick = () => { if (busy) return; hands[cur].done = true; next(); };
  $('double').onclick = () => {
    if (busy) return; const h = hands[cur];
    if (!Casino.bet(h.bet)) return;
    h.bet *= 2; h.cards.push(draw()); h.done = true; next();
  };
  $('split').onclick = () => {
    if (busy) return; const h = hands[cur];
    if (!Casino.bet(h.bet)) return;
    const n = { cards: [h.cards.pop()], bet: h.bet };
    hands.splice(cur + 1, 0, n);
    h.cards.push(draw()); n.cards.push(draw());
    if (h.cards[0].r === 14) { h.done = true; n.done = true; }
    next();
  };
})();
</script>
</body>
</html>
