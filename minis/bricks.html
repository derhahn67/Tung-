<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Brick Breaker</title>
<script src="../cookies.js" defer></script>
</head>
<body>
<script src="mini.js"></script>
<script>
(() => {
  const COLS = 9, HPCOL = ['', '#4fc3f7', '#ba68c8', '#ff7043'], POWERS = [['W', '#e53935', 'Wide'], ['M', '#43a047', 'Multi-ball'], ['S', '#1e88e5', 'Slow-mo'], ['L', '#fdd835', 'Laser'], ['❤', '#ec407a', 'Extra life']];
  const parts = Mini.particles();
  let paddle, balls, bricks, drops, lasers, lives, score, level, wideT, slowT, laserT, laserCd, area, msg, held, baseSpeed;
  function makeArea(S) { const w = Math.min(S.W - 16, 520); area = { x: (S.W - w) / 2, w, top: S.top + 70, bot: S.bot - 20 }; }
  function buildLevel(n) {
    bricks = [];
    const rows = Math.min(5 + Math.floor(n / 2), 10), bw = area.w / COLS, bh = Math.max(18, Math.min(26, bw * 0.45));
    const pattern = n % 5;
    for (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++) {
      let on = true;
      if (pattern === 1) on = (r + c) % 2 === 0 || r < 2;
      else if (pattern === 2) on = Math.abs(c - 4) <= r;
      else if (pattern === 3) on = c !== 4 && (r % 3 !== 2);
      else if (pattern === 4) on = (c % 3 !== 1) || r % 2 === 0;
      if (!on) continue;
      let hp = 1 + Math.floor((rows - r - 1) / 3 * Math.min(1, n / 4 + 0.4));
      hp = Mini.clamp(hp + (Math.random() < n * 0.03 ? 1 : 0), 1, 3);
      const steel = n >= 3 && r === rows - 1 && c % 4 === 0;
      bricks.push({ x: area.x + c * bw, y: area.top + 30 + r * (bh + 3), w: bw - 3, h: bh, hp: steel ? Infinity : hp, max: hp, steel });
    }
    resetBall(); drops = []; lasers = []; msg = { t: 1.6, s: 'Level ' + (n + 1) };
    baseSpeed = 330 + n * 18;
  }
  function resetBall() { balls = [{ x: paddle.x, y: paddle.y - 14, vx: 0, vy: 0, r: 7 }]; held = true; }
  function launch() { if (!held) return; held = false; const a = -Math.PI / 2 + Mini.rand(-0.35, 0.35); balls[0].vx = Math.cos(a) * baseSpeed; balls[0].vy = Math.sin(a) * baseSpeed; Mini.sfx('jump'); }
  function hitBrick(b, S) {
    if (b.steel) { Mini.sfx('tap'); return; }
    b.hp--; Mini.sfx(b.hp > 0 ? 'tap' : 'pop');
    if (b.hp <= 0) {
      b.dead = true; score += 10 * b.max;
      parts.burst(b.x + b.w / 2, b.y + b.h / 2, HPCOL[b.max], 10, 160, 5);
      if (Math.random() < 0.13) { const P = Mini.pick(POWERS); drops.push({ x: b.x + b.w / 2, y: b.y, p: P }); }
    }
  }
  function collideBall(ball, S) {
    for (const b of bricks) {
      if (b.dead) continue;
      const cx = Mini.clamp(ball.x, b.x, b.x + b.w), cy = Mini.clamp(ball.y, b.y, b.y + b.h);
      if ((ball.x - cx) ** 2 + (ball.y - cy) ** 2 > ball.r * ball.r) continue;
      const ox = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r)), oy = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
      if (ox < oy) { ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx); }
      else { ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy); }
      hitBrick(b, S);
      return;
    }
  }
  Mini.game({
    id: 'bricks', title: 'Brick Breaker', icon: '🧱',
    tagline: 'The classic! Bounce the ball, smash every brick and catch the power-ups as they fall.',
    how: '👆 Drag anywhere to move the paddle, tap to launch.<br>🎁 Catch drops: <b>W</b>ide, <b>M</b>ulti-ball, <b>S</b>low, <b>L</b>aser, ❤ life.<br>⬛ Steel bricks can\'t be broken.',
    init(S) {
      makeArea(S); paddle = { x: S.W / 2, y: area.bot - 40, w: 90 };
      lives = 3; score = 0; level = 0; wideT = slowT = laserT = 0; laserCd = 0; parts.clear(); buildLevel(0);
    },
    resize(S) { if (paddle) { makeArea(S); paddle.y = area.bot - 40; } },
    down(x) { paddle.x = x; },
    move(x) { paddle.x = x; },
    tap() { launch(); },
    key(code) { if (code === 'Space' || code === 'ArrowUp') launch(); },
    update(dt, S) {
      parts.update(dt);
      if (msg) { msg.t -= dt; if (msg.t <= 0) msg = null; }
      if (S.keys.has('ArrowLeft') || S.keys.has('KeyA')) paddle.x -= 520 * dt;
      if (S.keys.has('ArrowRight') || S.keys.has('KeyD')) paddle.x += 520 * dt;
      wideT = Math.max(0, wideT - dt); slowT = Math.max(0, slowT - dt); laserT = Math.max(0, laserT - dt);
      paddle.w = wideT > 0 ? 150 : 90;
      paddle.x = Mini.clamp(paddle.x, area.x + paddle.w / 2, area.x + area.w - paddle.w / 2);
      const spd = baseSpeed * (slowT > 0 ? 0.65 : 1) * (1 + Math.min(0.4, S.time / 300));
      if (held) { balls[0].x = paddle.x; balls[0].y = paddle.y - 14; }
      else for (const ball of balls) {
        const steps = 3;
        for (let k = 0; k < steps; k++) {
          const l = Math.hypot(ball.vx, ball.vy) || 1; ball.vx = ball.vx / l * spd; ball.vy = ball.vy / l * spd;
          ball.x += ball.vx * dt / steps; ball.y += ball.vy * dt / steps;
          if (ball.x < area.x + ball.r) { ball.x = area.x + ball.r; ball.vx = Math.abs(ball.vx); }
          if (ball.x > area.x + area.w - ball.r) { ball.x = area.x + area.w - ball.r; ball.vx = -Math.abs(ball.vx); }
          if (ball.y < area.top + ball.r) { ball.y = area.top + ball.r; ball.vy = Math.abs(ball.vy); }
          if (ball.vy > 0 && ball.y + ball.r >= paddle.y - 7 && ball.y < paddle.y + 8 && Math.abs(ball.x - paddle.x) < paddle.w / 2 + ball.r) {
            const off = (ball.x - paddle.x) / (paddle.w / 2), a = -Math.PI / 2 + off * 1.1;
            ball.vx = Math.cos(a) * spd; ball.vy = Math.sin(a) * spd; Mini.sfx('tap');
          }
          if (Math.abs(ball.vy) < spd * 0.2) ball.vy = Math.sign(ball.vy || -1) * spd * 0.2;
          collideBall(ball, S);
        }
        if (ball.y > S.H + 20) ball.lost = true;
      }
      balls = balls.filter((b) => !b.lost);
      if (!balls.length) {
        lives--; Mini.sfx('lose'); wideT = slowT = laserT = 0;
        if (lives <= 0) { S.over(score, 'OUT OF BALLS', 'Reached level ' + (level + 1)); return; }
        resetBall(); msg = { t: 1.2, s: lives + (lives === 1 ? ' ball left' : ' balls left') };
      }
      if (laserT > 0) {
        laserCd -= dt;
        if (laserCd <= 0) { laserCd = 0.35; lasers.push({ x: paddle.x - paddle.w / 2 + 6, y: paddle.y - 8 }, { x: paddle.x + paddle.w / 2 - 6, y: paddle.y - 8 }); Mini.sfx('shoot'); }
      }
      for (const l of lasers) {
        l.y -= 700 * dt;
        const b = bricks.find((o) => !o.dead && l.x > o.x && l.x < o.x + o.w && l.y > o.y && l.y < o.y + o.h);
        if (b) { l.done = true; hitBrick(b, S); }
        if (l.y < area.top) l.done = true;
      }
      lasers = lasers.filter((l) => !l.done);
      for (const d of drops) {
        d.y += 150 * dt;
        if (d.y > paddle.y - 10 && d.y < paddle.y + 12 && Math.abs(d.x - paddle.x) < paddle.w / 2 + 10) {
          d.done = true; Mini.sfx('coin'); msg = { t: 1, s: d.p[2] + '!' };
          const k = d.p[0];
          if (k === 'W') wideT = 12; else if (k === 'S') slowT = 10; else if (k === 'L') laserT = 10; else if (k === '❤') lives++;
          else if (k === 'M' && !held) { const src = balls[0]; for (const a of [-0.5, 0.5]) { const ang = Math.atan2(src.vy, src.vx) + a; balls.push({ x: src.x, y: src.y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 7 }); } }
        }
        if (d.y > S.H) d.done = true;
      }
      drops = drops.filter((d) => !d.done);
      bricks = bricks.filter((b) => !b.dead);
      if (!bricks.some((b) => !b.steel)) { score += 100 * (level + 1); level++; Mini.sfx('win'); buildLevel(level); }
    },
    draw(ctx, S) {
      const g = ctx.createLinearGradient(0, 0, 0, S.H); g.addColorStop(0, '#1a1040'); g.addColorStop(1, '#0a0d1c');
      ctx.fillStyle = g; ctx.fillRect(0, 0, S.W, S.H);
      if (!area) return;
      ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 2; ctx.strokeRect(area.x - 2, area.top - 2, area.w + 4, S.H);
      for (const b of bricks) {
        ctx.fillStyle = b.steel ? '#78909c' : HPCOL[b.hp]; Mini.rrect(ctx, b.x, b.y, b.w, b.h, 4); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(b.x + 3, b.y + 2, b.w - 6, 3);
        if (b.steel) { ctx.strokeStyle = '#37474f'; ctx.lineWidth = 2; ctx.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4); }
      }
      for (const d of drops) { ctx.fillStyle = d.p[1]; Mini.rrect(ctx, d.x - 16, d.y - 9, 32, 18, 9); ctx.fill(); Mini.text(ctx, d.p[0], d.x, d.y + 1, 12, '#fff', 'center', null); }
      ctx.fillStyle = '#ff5252'; for (const l of lasers) ctx.fillRect(l.x - 1.5, l.y - 8, 3, 12);
      const pg = ctx.createLinearGradient(0, paddle.y - 7, 0, paddle.y + 7); pg.addColorStop(0, laserT > 0 ? '#fff59d' : '#80deea'); pg.addColorStop(1, laserT > 0 ? '#f9a825' : '#00838f');
      ctx.fillStyle = pg; Mini.rrect(ctx, paddle.x - paddle.w / 2, paddle.y - 7, paddle.w, 14, 7); ctx.fill();
      for (const b of balls) { ctx.fillStyle = slowT > 0 ? '#90caf9' : '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Mini.TAU); ctx.fill(); }
      parts.draw(ctx);
      const top = S.top + 12;
      Mini.text(ctx, String(score), S.W / 2, top + 20, 26, '#fff');
      Mini.text(ctx, '❤'.repeat(Math.max(0, lives)), 14, top + 20, 18, '#ff5252', 'left');
      Mini.text(ctx, 'L' + (level + 1), S.W - 60, top + 20, 18, '#fff', 'right');
      if (held && S.state === 'play') Mini.text(ctx, 'Tap to launch', S.W / 2, paddle.y - 60, 18, '#fff');
      if (msg) { ctx.globalAlpha = Math.min(1, msg.t * 2); Mini.text(ctx, msg.s, S.W / 2, S.H * 0.55, 28, '#ffeb3b'); ctx.globalAlpha = 1; }
    },
  });
})();
</script>
</body>
</html>
