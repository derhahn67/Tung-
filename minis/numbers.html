<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Number Smasher</title>
<script src="../cookies.js" defer></script>
</head>
<body>
<script src="mini.js"></script>
<script>
(() => {
  const N = 4;
  const COLORS = { 2: ['#eee4da', '#776e65'], 4: ['#ede0c8', '#776e65'], 8: ['#f2b179', '#fff'], 16: ['#f59563', '#fff'], 32: ['#f67c5f', '#fff'], 64: ['#f65e3b', '#fff'],
    128: ['#edcf72', '#fff'], 256: ['#edcc61', '#fff'], 512: ['#edc850', '#fff'], 1024: ['#edc53f', '#fff'], 2048: ['#edc22e', '#fff'], big: ['#3c3a32', '#fff'] };
  let grid, tiles, score, nextId, anim, won, keepGoing, undoState, popups;
  const empty = () => { const out = []; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) out.push([r, c]); return out; };
  function spawn() {
    const e = empty(); if (!e.length) return;
    const [r, c] = Mini.pick(e), t = { id: nextId++, v: Math.random() < 0.9 ? 2 : 4, r, c, pr: r, pc: c, born: 0 };
    grid[r][c] = t; tiles.push(t);
  }
  function canMove() {
    if (empty().length) return true;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const v = grid[r][c].v; if ((c < N - 1 && grid[r][c + 1].v === v) || (r < N - 1 && grid[r + 1][c].v === v)) return true; }
    return false;
  }
  function move(dir, S) {
    if (anim > 0) return;
    const dr = dir === 'up' ? -1 : dir === 'down' ? 1 : 0, dc = dir === 'left' ? -1 : dir === 'right' ? 1 : 0;
    const snapshot = { g: grid.map((row) => row.map((t) => (t ? t.v : 0))), score };
    tiles.forEach((t) => { t.pr = t.r; t.pc = t.c; t.merged = false; t.born = 1; });
    tiles = tiles.filter((t) => !t.gone);
    let moved = false, gained = 0;
    const order = [...Array(N).keys()];
    const rows = dr > 0 ? order.slice().reverse() : order, cols = dc > 0 ? order.slice().reverse() : order;
    for (const r of rows) for (const c of cols) {
      const t = grid[r][c]; if (!t) continue;
      let nr = r, nc = c;
      while (true) {
        const tr = nr + dr, tc = nc + dc;
        if (tr < 0 || tr >= N || tc < 0 || tc >= N) break;
        const o = grid[tr][tc];
        if (!o) { nr = tr; nc = tc; continue; }
        if (o.v === t.v && !o.merged) { nr = tr; nc = tc; }
        break;
      }
      if (nr === r && nc === c) continue;
      moved = true;
      grid[r][c] = null;
      const o = grid[nr][nc];
      if (o) { o.v *= 2; o.merged = true; o.pop = 1; gained += o.v; t.gone = true; t.r = nr; t.c = nc; popups.push({ r: nr, c: nc, v: o.v, t: 0.8 }); }
      else { grid[nr][nc] = t; t.r = nr; t.c = nc; }
    }
    if (!moved) return;
    undoState = snapshot;
    score += gained; anim = 1;
    Mini.sfx(gained ? 'pop' : 'tap');
    spawn();
    if (!won && tiles.some((t) => !t.gone && t.v >= 2048)) { won = true; Mini.sfx('win'); }
    if (!canMove()) setTimeout(() => S.over(score, 'NO MORE MOVES', 'Biggest tile: ' + Math.max(...tiles.filter((t) => !t.gone).map((t) => t.v))), 400);
  }
  function geo(S) {
    const size = Math.min(S.W - 28, S.H - S.top - 200, 480), x = (S.W - size) / 2, y = Math.max(S.top + 120, (S.H - size) / 2 + 30);
    const gap = size * 0.03, cell = (size - gap * (N + 1)) / N;
    return { x, y, size, gap, cell };
  }
  Mini.game({
    id: 'numbers', title: 'Number Smasher', icon: '🔢',
    tagline: 'Smash matching numbers together until you reach 2048, and then keep going!',
    how: '👆 Swipe (or use the arrow keys) to slide every tile.<br>➕ Two equal numbers that collide merge into their sum.<br>🏆 Reach the 2048 tile. The game ends when the board is full.',
    keyRepeat: false,
    init(S) {
      grid = [...Array(N)].map(() => Array(N).fill(null)); tiles = []; score = 0; nextId = 1; anim = 0; won = false; undoState = null; popups = [];
      spawn(); spawn();
    },
    swipe(dir, S) { move(dir, S); },
    key(code, S) {
      const m = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' }[code];
      if (m) move(m, S);
      if (code === 'KeyU') undo();
    },
    tap(x, y, S) { const g = geo(S); if (undoState && y > g.y + g.size + 10 && y < g.y + g.size + 60 && Math.abs(x - S.W / 2) < 70) undo(); },
    update(dt) {
      anim = Math.max(0, anim - dt * 7);
      tiles.forEach((t) => { if (t.pop) t.pop = Math.max(0, t.pop - dt * 5); if (t.born < 1) t.born = Math.min(1, t.born + dt * 6); });
      if (anim === 0) tiles = tiles.filter((t) => !t.gone);
      popups.forEach((p) => { p.t -= dt; }); popups = popups.filter((p) => p.t > 0);
    },
    draw(ctx, S) {
      ctx.fillStyle = '#faf8ef'; ctx.fillRect(0, 0, S.W, S.H);
      const g = geo(S);
      Mini.text(ctx, 'SCORE', S.W / 2 - 70, S.top + 40, 13, '#bbada0', 'center', null);
      Mini.text(ctx, String(score), S.W / 2 - 70, S.top + 64, 26, '#776e65', 'center', null);
      Mini.text(ctx, 'BEST', S.W / 2 + 70, S.top + 40, 13, '#bbada0', 'center', null);
      Mini.text(ctx, String(Math.max(score, Mini.store.get('best-numbers', 0) || 0)), S.W / 2 + 70, S.top + 64, 26, '#776e65', 'center', null);
      if (won) Mini.text(ctx, '🎉 2048! Keep smashing!', S.W / 2, S.top + 96, 16, '#f67c5f', 'center', null);
      ctx.fillStyle = '#bbada0'; Mini.rrect(ctx, g.x, g.y, g.size, g.size, 10); ctx.fill();
      const pos = (r, c) => [g.x + g.gap + c * (g.cell + g.gap), g.y + g.gap + r * (g.cell + g.gap)];
      ctx.fillStyle = 'rgba(238,228,218,0.35)';
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const [x, y] = pos(r, c); Mini.rrect(ctx, x, y, g.cell, g.cell, 6); ctx.fill(); }
      const k = 1 - anim;
      const drawList = tiles.slice().sort((a, b) => (a.gone ? -1 : 0) - (b.gone ? -1 : 0));
      for (const t of drawList) {
        const [x0, y0] = pos(t.pr, t.pc), [x1, y1] = pos(t.r, t.c);
        const x = x0 + (x1 - x0) * k, y = y0 + (y1 - y0) * k;
        const sc = t.born < 1 ? t.born : 1 + (t.pop || 0) * 0.12 * (anim === 0 ? 1 : 0);
        const [bg, fg] = COLORS[t.v] || COLORS.big;
        ctx.save(); ctx.translate(x + g.cell / 2, y + g.cell / 2); ctx.scale(sc, sc);
        ctx.fillStyle = bg; Mini.rrect(ctx, -g.cell / 2, -g.cell / 2, g.cell, g.cell, 6); ctx.fill();
        const digits = String(t.v).length;
        Mini.text(ctx, String(t.v), 0, 2, g.cell * (digits <= 2 ? 0.45 : digits === 3 ? 0.38 : 0.3), fg, 'center', null);
        ctx.restore();
      }
      for (const p of popups) { const [x, y] = pos(p.r, p.c); ctx.globalAlpha = Math.min(1, p.t * 2); Mini.text(ctx, '+' + p.v, x + g.cell / 2, y - 6 - (0.8 - p.t) * 30, 16, '#f67c5f', 'center', null); }
      ctx.globalAlpha = 1;
      if (undoState) { ctx.fillStyle = '#8f7a66'; Mini.rrect(ctx, S.W / 2 - 60, g.y + g.size + 16, 120, 38, 10); ctx.fill(); Mini.text(ctx, '↶ Undo', S.W / 2, g.y + g.size + 35, 16, '#fff', 'center', null); }
    },
  });
  function undo() {
    if (!undoState || anim > 0) return;
    grid = [...Array(N)].map(() => Array(N).fill(null)); tiles = [];
    undoState.g.forEach((row, r) => row.forEach((v, c) => { if (v) { const t = { id: nextId++, v, r, c, pr: r, pc: c, born: 1 }; grid[r][c] = t; tiles.push(t); } }));
    score = undoState.score; undoState = null; Mini.sfx('swoosh');
  }
})();
</script>
</body>
</html>
