<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Slipper Thrower</title>
<script src="../cookies.js" defer></script>
</head>
<body>
<script src="mini.js"></script>
<script>
(() => {
  const TIME = 60, G = 900;
  const KINDS = [
    { e: '🕷️', pts: 10, spd: 70, size: 34, w: 5 }, { e: '🦟', pts: 15, spd: 130, size: 28, w: 4, fly: true }, { e: '🐭', pts: 20, spd: 160, size: 36, w: 3, floor: true },
    { e: '🐜', pts: 10, spd: 60, size: 28, w: 4 }, { e: '🪙', pts: 50, spd: 220, size: 30, w: 1, fly: true, gold: true }, { e: '🐈', pts: -30, spd: 90, size: 46, w: 1, floor: true, cat: true },
  ];
  const parts = Mini.particles();
  let foes, slippers, timeLeft, score, combo, best, spawnT, floats, aim, hand, shakeT;
  function spawn(S) {
    let r = Math.random() * KINDS.reduce((a, k) => a + k.w, 0), K = KINDS[0];
    for (const k of KINDS) { r -= k.w; if (r <= 0) { K = k; break; } }
    const fromLeft = Math.random() < 0.5;
    const y = K.floor ? S.bot - 150 : K.fly ? Mini.rand(S.top + 110, S.H * 0.5) : Mini.rand(S.top + 110, S.bot - 230);
    foes.push({ K, x: fromLeft ? -30 : S.W + 30, y, vx: (fromLeft ? 1 : -1) * K.spd * Mini.rand(0.8, 1.3), ph: Math.random() * 6, by: y });
  }
  function throwAt(S, tx, ty, power) {
    const sx = hand.x, sy = hand.y;
    const dx = tx - sx, dy = ty - sy;
    const t = Math.max(0.35, Math.min(0.9, Math.hypot(dx, dy) / (900 * power)));
    slippers.push({ x: sx, y: sy, vx: dx / t, vy: dy / t - 0.5 * G * t, rot: 0, life: 2 });
    Mini.sfx('swoosh');
  }
  Mini.game({
    id: 'slipper', title: 'Slipper Thrower', icon: '🥿',
    tagline: 'The house is crawling with creepy-crawlies and only your trusty slipper can save it. 60 seconds. Go!',
    how: '👆 Flick toward a bug (or just tap it) to hurl a slipper.<br>🔥 Hit in a row for combo points. 🪙 is a bonus!<br>🐈 Don\'t hit the cat!',
    fmtScore: (v) => String(v),
    init(S) { foes = []; slippers = []; timeLeft = TIME; score = 0; combo = 0; best = 0; spawnT = 0; floats = []; aim = null; shakeT = 0; hand = { x: S.W / 2, y: S.bot - 50 }; parts.clear(); },
    resize(S) { if (hand) { hand.x = S.W / 2; hand.y = S.bot - 50; } },
    down(x, y) { aim = { x, y }; },
    move(x, y) { if (aim) { aim.x = x; aim.y = y; } },
    up(x, y, S) {
      if (!aim) return;
      const P = S.pointer, dx = x - P.sx, dy = y - P.sy, dt = Math.max(16, performance.now() - P.t0);
      if (Math.hypot(dx, dy) > 25 && dy < 0) {
        const sp = Math.hypot(dx, dy) / dt;
        const tx = hand.x + dx / Math.hypot(dx, dy) * 900, ty = hand.y + dy / Math.hypot(dx, dy) * 900;
        const k = Mini.clamp(sp * 0.9, 0.5, 1.6);
        // aim toward the foe nearest the flick line so a sloppy flick still feels fair
        let best = null, bd = 1e9;
        for (const f of foes) { const d = Math.abs((f.x - hand.x) * dy - (f.y - hand.y) * dx) / Math.hypot(dx, dy); if (d < 60 && f.y < hand.y && d < bd) { bd = d; best = f; } }
        if (best) throwAt(S, best.x + best.vx * 0.3, best.y, k); else throwAt(S, hand.x + (tx - hand.x) * 0.5 * k, hand.y + (ty - hand.y) * 0.5 * k, k);
      } else throwAt(S, x, y, 1);
      aim = null;
    },
    update(dt, S) {
      parts.update(dt); shakeT = Math.max(0, shakeT - dt);
      floats.forEach((f) => { f.t -= dt; f.y -= 40 * dt; }); floats = floats.filter((f) => f.t > 0);
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = 0; S.over(score, 'TIME\'S UP!', 'Best combo ×' + best); return; }
      spawnT -= dt;
      if (spawnT <= 0) { spawn(S); spawnT = Math.max(0.35, 1.1 - (TIME - timeLeft) / 70); }
      for (const f of foes) { f.x += f.vx * dt; f.ph += dt; if (f.K.fly) f.y = f.by + Math.sin(f.ph * 4) * 26; }
      foes = foes.filter((f) => f.x > -60 && f.x < S.W + 60 && !f.dead);
      for (const s of slippers) {
        s.vy += G * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += dt * 14; s.life -= dt;
        for (const f of foes) {
          if (f.dead || Math.hypot(f.x - s.x, f.y - s.y) > f.K.size * 0.6 + 12) continue;
          f.dead = true; s.done = true;
          if (f.K.cat) { combo = 0; score = Math.max(0, score + f.K.pts); floats.push({ x: f.x, y: f.y, t: 1, s: 'MEOW! ' + f.K.pts, c: '#ff8a80' }); Mini.sfx('lose'); shakeT = 0.3; break; }
          combo++; best = Math.max(best, combo);
          const pts = f.K.pts * Math.min(5, 1 + Math.floor(combo / 3));
          score += pts; floats.push({ x: f.x, y: f.y, t: 1, s: '+' + pts + (combo >= 3 ? ' ×' + Math.min(5, 1 + Math.floor(combo / 3)) : ''), c: f.K.gold ? '#ffd54f' : '#fff' });
          parts.burst(f.x, f.y, f.K.gold ? '#ffd54f' : '#795548', 14, 200, 5); Mini.sfx(f.K.gold ? 'coin' : 'hit');
          if (f.K.gold) timeLeft = Math.min(TIME, timeLeft + 3);
          break;
        }
        if (!s.done && (s.y > S.H + 40 || s.life <= 0)) { s.done = true; combo = 0; }
      }
      slippers = slippers.filter((s) => !s.done);
    },
    draw(ctx, S) {
      ctx.save(); if (shakeT) ctx.translate(Mini.rand(-6, 6), Mini.rand(-6, 6));
      ctx.fillStyle = '#f3e5d0'; ctx.fillRect(0, 0, S.W, S.H);
      ctx.fillStyle = '#e6d2b5'; for (let x = 0; x < S.W; x += 46) ctx.fillRect(x, 0, 23, S.bot - 120);
      ctx.fillStyle = '#a1887f'; ctx.fillRect(0, S.bot - 120, S.W, S.H);
      ctx.fillStyle = '#8d6e63'; for (let x = 0; x < S.W; x += 70) ctx.fillRect(x, S.bot - 120, 2, S.H);
      ctx.fillStyle = '#6d4c41'; ctx.fillRect(0, S.bot - 124, S.W, 6);
      Mini.emoji(ctx, '🖼️', S.W * 0.25, S.top + 150, 60); Mini.emoji(ctx, '🪴', S.W * 0.85, S.bot - 160, 70); Mini.emoji(ctx, '🛋️', S.W * 0.15, S.bot - 150, 80);
      if (foes) for (const f of foes) Mini.emoji(ctx, f.K.e, f.x, f.y, f.K.size, f.K.fly ? 0 : Math.sin(f.ph * 12) * 0.1, f.vx > 0);
      if (slippers) for (const s of slippers) Mini.emoji(ctx, '🥿', s.x, s.y, 34, s.rot);
      if (aim && hand) { ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.setLineDash([6, 8]); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(hand.x, hand.y); ctx.lineTo(aim.x, aim.y); ctx.stroke(); ctx.setLineDash([]); }
      if (hand) Mini.emoji(ctx, '✋', hand.x, hand.y, 54);
      parts.draw(ctx);
      for (const f of floats || []) { ctx.globalAlpha = Math.min(1, f.t * 2); Mini.text(ctx, f.s, f.x, f.y - 20, 20, f.c); }
      ctx.globalAlpha = 1;
      ctx.restore();
      const top = S.top + 14;
      Mini.text(ctx, String(score || 0), S.W / 2, top + 20, 30, '#4e342e', 'center', 'rgba(255,255,255,.8)');
      Mini.text(ctx, '⏱ ' + Math.ceil(timeLeft || 0), 16, top + 20, 22, (timeLeft || 0) < 10 ? '#d32f2f' : '#4e342e', 'left', 'rgba(255,255,255,.8)');
      if (combo >= 2) Mini.text(ctx, '🔥 ×' + combo, S.W - 60, top + 20, 20, '#e65100', 'right', 'rgba(255,255,255,.8)');
    },
  });
})();
</script>
</body>
</html>
